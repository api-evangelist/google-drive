aid: google-drive
name: Google Drive
description: >-
  The Google Drive API allows developers to integrate with Google Drive to create, read, update, and delete files and
  folders stored in Google Drive. The v3 REST API supports file metadata operations, content upload and download, folder
  hierarchies, sharing and permissions, and search across a user's Drive.
